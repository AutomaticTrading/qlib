name: Test qlib from source

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    timeout-minutes: 180
    env:
      MLFLOW_ALLOW_FILE_STORE: "true"
      PIP_CONSTRAINT: ${{ github.workspace }}/.github/ci/constraints.txt
    # we may retry for 3 times for `Unit tests with Pytest`

    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, ubuntu-22.04, macos-14, macos-15]
        # In github action, using python 3.7, pip install will not match the latest version of the package.
        # Also, python 3.7 is no longer supported from macos-14, and will be phased out from macos-13 in the near future.
        # All things considered, we have removed python 3.7.
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]

    steps:
    - name: Test qlib from source
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        fetch-depth: 0

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Create isolated Python environment
      run: |
        python -m venv .venv
        python -c "import os, pathlib; scripts = pathlib.Path('.venv') / ('Scripts' if os.name == 'nt' else 'bin'); open(os.environ['GITHUB_PATH'], 'a', encoding='utf-8').write(str(scripts.resolve()) + os.linesep)"

    - name: Update pip to the latest version
      run: |
        python -m pip install --upgrade pip

    - name: Installing pytorch for ubuntu
      if: ${{ matrix.os == 'ubuntu-24.04' || matrix.os == 'ubuntu-22.04' }}
      run: |
        python -m pip install torch --extra-index-url https://download.pytorch.org/whl/cpu

    - name: Set up Python tools
      env:
        # RL tests are Linux-only; only ubuntu-22.04 builds the docs below.
        CI_EXTRAS: dev,test,analysis,lint${{ runner.os == 'Linux' && ',rl' || '' }}${{ matrix.os == 'ubuntu-22.04' && ',docs' || '' }}
      run: |
        make ci-install

    # Importing Qlib's model registry also loads LightGBM and its OpenMP runtime.
    - name: Install Lightgbm for MacOS
      if: ${{ matrix.os == 'macos-14' || matrix.os == 'macos-15' }}
      run: |
        brew update
        brew install libomp || brew reinstall libomp
        python -m pip install --no-binary=:all: lightgbm
        python -c "import lightgbm; print('LightGBM', lightgbm.__version__, 'native import passed')"

    - name: Verify neural network test dependencies
      run: python -c "import torch; from qlib.contrib.model import pytorch_classes; from qlib.contrib.model.pytorch_general_nn import GeneralPTNN; from qlib.data.dataset import DatasetH, TSDatasetH; assert pytorch_classes; print('PyTorch', torch.__version__, 'model imports passed')"

    - name: Verify non-Linux dependency footprint
      if: ${{ runner.os != 'Linux' }}
      run: python -c "from importlib.metadata import distributions; umø×›h‘éì¶»§q«^u½¹Í¡•µ„ˆ°€ˆÈ¸ÈÄ¸Èˆ¤°(€€€€€€€€€€€€ ‰Á±½Ñ±äˆ°€ˆØ¸ä¸Àˆ¤°(€€€€€€€€€€€€ ‰±áµ°ˆ°€ˆØ¸Ä¸Èˆ¤°(€€€€€€€€€€€€ ‰½ÍÅÀˆ°€ˆÄ¸À¸Ôˆ¤°(€€€€€€€€€€€€ ‰‰±…¬ˆ°€ˆÈÔ¸ÄÈ¸Àˆ¤°(€€€€€€€€¤è(€€€€€€€€€€€Ý¥Ñ Í•±˜¹ÍÕ‰Q•ÍÐ¡Á…­…”õ¹…µ”°Ù•ÉÍ¥½¸õÙ•ÉÍ¥½¸¤è(€€€€€€€€€€€€€€€Í•±˜¹…ÍÍ•ÉÑ%¸¡Ù•ÉÍ¥½¸°Í•±˜¹½¹ÍÑÉ…¥¹ÑÍm¹…µ•t¹ÍÁ•¥™¥•È¤((€€€‘•˜Ñ•ÍÑ}Á±…Ñ™½Éµ}‰½Õ¹‘Í}‘½}¹½Ñ}±•…­}Ñ½}½Ñ¡•É}•¹Ù¥É½¹µ•¹ÑÌ¡Í•±˜¤è(€€€€€€€™½ÈÁ±…Ñ™½É´¥¸€ ‰Ý¥¸ÌÈˆ°€‰±¥¹Õàˆ°€‰‘…ÉÝ¥¸ˆ¤è(€€€€€€€€€€€™½ÈÙ•ÉÍ¥½¸¥¸€ ˆÌ¸àˆ°€ˆÌ¸äˆ°€ˆÌ¸ÄÀˆ°€ˆÌ¸ÄÄˆ°€ˆÌ¸ÄÈˆ¤è(€€€€€€€€€€€€€€€•¹Ø€ô‘¥Ð¡‘•™…Õ±Ñ}•¹Ù¥É½¹µ•¹Ð ¤°ÍåÍ}Á±…Ñ™½É´õÁ±…Ñ™½É´°ÁåÑ¡½¹}Ù•ÉÍ¥½¸õÙ•ÉÍ¥½¸¤(€€€€€€€€€€€€€€€Ý¥Ñ Í•±˜¹ÍÕ‰Q•ÍÐ¡Á±…Ñ™½É´õÁ±…Ñ™½É´°ÁåÑ¡½¸õÙ•ÉÍ¥½¸¤è(€€€€€€€€€€€€€€€€€€€Í•±˜¹…ÍÍ•ÉÑÅÕ…° (€€€€€€€€€€€€€€€€€€€€€€€Í•±˜¹½¹ÍÑÉ…¥¹ÑÍl‰½ÍÅÀ‰t¹µ…É­•È¹•Ù…±Õ…Ñ”¡•¹Ø¤°Á±…Ñ™½É´€ôô€‰Ý¥¸ÌÈˆ…¹Ù•ÉÍ¥½¸€ôô€ˆÌ¸àˆ(€€€€€€€€€€€€€€€€€€€€¤(€€€€€€€€€€€€€€€€€€€Í•±˜¹…ÍÍ•ÉÑÅÕ…°¡Í•±˜¹½¹ÍÑÉ…¥¹ÑÍl‰™…ÍÑ©Í½¹Í¡•µ„‰t¹µ…É­•È¹•Ù…±Õ…Ñ”¡•¹Ø¤°Ù•ÉÍ¥½¸¥¸€ ˆÌ¸àˆ°€ˆÌ¸äˆ¤¤((€€€‘•˜Ñ•ÍÑ}…±±}Á¥Á}ÍÕ‰ÁÉ½•ÍÍ•Í}¥¹¡•É¥Ñ}…‰Í½±ÕÑ•}½¹ÍÑÉ…¥¹ÑÌ¡Í•±˜¤è(€€€€€€€™½È¹…µ”°Ý½É­™±½Ü¥¸Í•±˜¹Ý½É­™±½ÝÌ¹¥Ñ•µÌ ¤è(€€€€€€€€€€€Ý¥Ñ Í•±˜¹ÍÕ‰Q•ÍÐ¡Ý½É­™±½Üõ¹…µ”¤è(€€€€€€€€€€€€€€€©½ˆ€ôÝ½É­™±½Ýl‰©½‰Ì‰ul‰‰Õ¥±‰t(€€€€€€€€€€€€€€€Í•±˜¹…ÍÍ•ÉÑÅÕ…°¡©½‰l‰•¹Ø‰ul‰A%A}=9MQI%9P‰t°€ˆ‘íì¥Ñ¡Õˆ¹Ý½É­ÍÁ…”õô¼¹¥Ñ¡Õˆ½¤½½¹ÍÑÉ…¥¹ÑÌ¹ÑáÐˆ¤(€€€€€€€€€€€€€€€Í•±˜¹…ÍÍ•ÉÑÅÕ…°¡©½‰l‰•¹Ø‰ul‰511=]}11=]}%1}MQ=I‰t°€‰ÑÉÕ”ˆ¤(€€€€€€€€€€€€€€€™½ÈÍÑ•À¥¸©½‰l‰ÍÑ•ÁÌ‰tè(€€€€€€€€€€€€€€€€€€€Í•±˜¹…ÍÍ•ÉÑ9½Ñ%¸ ‰A%A}=9MQI%9Pˆ°ÍÑ•À¹•Ð ‰•¹Øˆ°íô¤¤((€€€‘•˜Ñ•ÍÑ}¥}ÁåÑ¡½¹}•¹Ù¥É½¹µ•¹Ñ}¥Í}¥Í½±…Ñ•‘}™É½µ}ÉÕ¹¹•É}Á…­…•Ì¡Í•±˜¤è(€€€€€€€™½È¹…µ”°Ý½É­™±½Ü¥¸Í•±˜¹Ý½É­™±½ÝÌ¹¥Ñ•µÌ ¤è(€€€€€€€€€€€Ý¥Ñ Í•±˜¹ÍÕ‰Q•ÍÐ¡Ý½É­™±½Üõ¹…µ”¤è(€€€€€€€€€€€€€€€ÍÑ•ÁÌ€ôÝ½É­™±½Ýl‰©½‰Ì‰ul‰‰Õ¥±‰ul‰ÍÑ•ÁÌ‰t(€€€€€€€€€€€€€€€Í•ÑÕÀ€ô¹•áÐ¡¤™½È¤°ÍÑ•À¥¸•¹Õµ•É…Ñ”¡ÍÑ•ÁÌ¤¥˜ÍÑ•Ál‰¹…µ”‰t¹ÍÑ…ÉÑÍÝ¥Ñ  ‰M•ÐÕÀAåÑ¡½¸€ˆ¤¤(€€€€€€€€€€€€€€€¥Í½±…Ñ”€ô¹•áÐ (€€€€€€€€€€€€€€€€€€€¤™½È¤°ÍÑ•À¥¸•¹Õµ•É…Ñ”¡ÍÑ•ÁÌ¤¥˜